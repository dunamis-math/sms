<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>문자 보내기</title>
<style>
  :root{--bg:#f3f5f9;--card:#fff;--ink:#1a2233;--muted:#5d6779;--line:#dbe0e8;--accent:#2f4fa2;--accent-ink:#fff;--bubble:#e9ecf2}
  @media (prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#171c27;--ink:#e6e9f0;--muted:#9aa3b5;--line:#2a3142;--accent:#93abf2;--accent-ink:#0f1630;--bubble:#232a38;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.55}
  main{max-width:480px;margin:0 auto;padding:28px 18px 40px;display:grid;gap:16px}
  h1{font-size:22px;margin:0}
  .to{font-size:15px;color:var(--muted)}
  .to b{color:var(--ink);font-size:20px;letter-spacing:.02em}
  .bubble{background:var(--bubble);border-radius:18px 18px 18px 6px;padding:14px 16px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15px;max-height:46vh;overflow:auto}
  .go{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:700;border-radius:14px;padding:18px}
  .sub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
  .hint{font-size:13.5px;color:var(--muted);margin:0}
  .err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-align:center}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s}
  #toast.on{opacity:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script>
  // 번호와 내용은 주소의 # 뒤에서만 읽어요. # 뒤 내용은 서버로 전송되지 않아요.
  var p = new URLSearchParams(location.hash.slice(1));
  var to = (p.get('to') || '').replace(/[^0-9]/g, '');
  var body = p.get('body') || '';
  var who = p.get('who') || '';
  var app = document.getElementById('app');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(d){return d.length===11?d.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3'):d}
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2200)}
  function copy(text,label){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast(label+' 복사했어요')},function(){toast('길게 눌러 복사해 주세요')})}
    else toast('길게 눌러 복사해 주세요');
  }
  if(!to){
    app.innerHTML='<div class="err"><h1>문자 보내기</h1><p class="hint" style="margin-top:8px">학원 관리 앱의 ‘바로 보내기’ 버튼으로 열어 주세요.</p></div>';
  }else{
    var href='sms:'+to+'?body='+encodeURIComponent(body);
    app.innerHTML=
      '<h1>'+(who?esc(who)+' 학부모님께':'문자 보내기')+'</h1>'+
      '<div class="to">받는 사람 <b>'+esc(fmt(to))+'</b></div>'+
      '<div class="bubble">'+esc(body)+'</div>'+
      '<a class="go" id="go" href="'+esc(href)+'">문자 앱 열기</a>'+
      '<div class="sub"><button id="cpTo">번호 복사</button><button id="cpBody">내용 복사</button></div>'+
      '<p class="hint">문자를 보낸 뒤 Claude로 돌아가 ‘보냈어요’를 눌러 주세요. 이 창은 닫아도 돼요.</p>';
    document.getElementById('cpTo').onclick=function(){copy(to,'번호를')};
    document.getElementById('cpBody').onclick=function(){copy(body,'내용을')};
  }
</script>
</body>
</html>
